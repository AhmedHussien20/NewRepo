    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const data = window.localStorage.getItem('report-data');
        if (data) {
            console.log(data);
            const parsedData = JSON.parse(data);
            console.log(parsedData);
            populateTable(parsedData);
        }
        function populateTable(data) {
            const tableBody = document.querySelector('#data-table tbody');

            // Clear existing table rows
            tableBody.innerHTML = '';

            // Populate table with data
            //data.reverse();
            console.log('ROwDATA: ' + data);
            console.log('ROwDATA: ' + data.transporter);
            console.log('ROwDATA: ' + data[0].transporter);
            if (data.length > 0) {

                const rowData = data;
                document.getElementById('transporter').innerHTML = rowData.transporter;
                document.getElementById('fsc').innerHTML = rowData.fscName;
                document.getElementById('crop').innerHTML = rowData.cropName;
                document.getElementById('refNo').innerHTML = rowData.referenceNumber;
                document.getElementById('distance').innerHTML = 0;
                document.getElementById('chiefdomName').innerHTML = rowData.chiefdomName;
                document.getElementById('consumption').innerHTML = 0;
                const row = document.createElement('tr');
                row.innerHTML = `
                                                    <td>Crop Cost</td>
                                                    <td>${rowData.itemUnitCost}</td>
                                                    <td>${rowData.kilograms}</td>
                                                    <td>${rowData.cropCost}</td>
                                                    <td>${rowData.cropCost}</td>
                                                    <td>0</td>
                                                `;
                tableBody.appendChild(row);

                row.innerHTML = `
                                                    <td>Transporter Cost</td>
                                                    <td>${rowData.transportCost}</td>
                                                    <td>1</td>
                                                    <td>${rowData.transportCost}</td>
                                                    <td>${rowData.transportCost}</td>
                                                    <td>0</td>
                                                `;
                tableBody.appendChild(row);
            }


            // Get the current date and time
            const currentDate = new Date();

            // Format the date as "dd/MM/yyyy hh:mm"
            const formattedDate = `${padZero(currentDate.getDate())}/${padZero(currentDate.getMonth() + 1)}/${currentDate.getFullYear()} ${padZero(currentDate.getHours())}:${padZero(currentDate.getMinutes())}`;

            // Set the innerHTML of the element with id "printedOn" to the formatted date
            //document.getElementById('printedOn').innerHTML = formattedDate;
        }

        function dateFormatter(_date) {
            // Array of month names
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

            // Get the day, month, and year from the date object
            const date = new Date(_date);
            const day = padZero(date.getDate());
            const month = monthNames[date.getMonth()];
            const year = date.getFullYear();

            // Concatenate the components into the desired format
            const formattedDate = `${day}.${month}.${year}`;

            return formattedDate;
        }

        function padZero(number) {
            return number < 10 ? '0' + number : number;
        }

        function formatNumber(value) {
            if (!isNaN(value)) {
                const roundedValue = Math.round(value * 100) / 100;
                return roundedValue.toFixed(2);
            } else {
                return '0.00';
            }
        }

        function formatCurrency(amount, currencyCode = 'ZMW') {
            const formatter = new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: currencyCode,
            });

            const parts = formatter.formatToParts(amount);
            let formattedNumber = '';
            for (const part of parts) {
                if (part.type !== 'currency') {
                    formattedNumber += part.value.replace(',', '') + ' '; // Remove commas and add a space
                }
            }
            return formattedNumber.trim();
        }

        function noBreak(inputString) {
            // Replace spaces with non-breaking spaces
            return inputString.replace(/ /g, '&nbsp;');
        }


        function capitalizeName(name) {
            const words = name.split(' ');
            const capitalizedWords = words.map(word => {
                if (word.length > 0) {
                    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                } else {
                    return '';
                }
            });
            return capitalizedWords.join(' ');
        }

    </script>
